name: GIS verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: assocmap_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: assocmap_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      ASSOCMAP_MEMBERSHIP_TESTS: '1'
      ASSOCMAP_GIS_STORAGE_TESTS: '1'
      ASSOCMAP_USER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run typecheck:gis
      - run: node --test tests/js/gis-*.test.mjs
      - run: npm run build
      - run: php artisan test --compact --filter='Gis|AssociationManagementTest|AuditLogTest'
