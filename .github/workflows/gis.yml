name: GIS verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: assocmap_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: assocmap_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      ASSOCMAP_MEMBERSHIP_TESTS: '1'
      ASSOCMAP_GIS_STORAGE_TESTS: '1'
      ASSOCMAP_USER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Create API roles in the disposable CI database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d assocmap_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - run: npm ci
      - run: npm run typecheck:gis
      - run: node --test tests/js/gis-*.test.mjs
      - run: npm run build
      - name: Verify standard-library GIS formats and archive validation
        run: python3 -m unittest discover -s python/gis -p test_worker.py -v
      - name: Check GIS PHP formatting
        run: >-
          vendor/bin/pint --test app/Http/Controllers/Admin/GisController.php
          app/Http/Requests/Admin/GisLocationRequest.php app/Http/Requests/Admin/StoreGisLocationRequest.php
          app/Http/Requests/Admin/UpdateGisLocationRequest.php app/Http/Requests/Admin/PublishGisLocationRequest.php
          app/Services/GisManagementService.php app/Services/GisIndexService.php app/Models/GisLocation.php
          app/Support/GisRevision.php app/Support/GisErrors.php tests/Feature/Gis*Test.php
          app/Services/GisReadService.php app/Services/GisTransferService.php app/Services/GisFileProcessor.php
          app/Http/Controllers/GisMapController.php app/Http/Controllers/Admin/GisTransferController.php
          app/Support/GisCoordinate.php app/Console/Commands/GisCleanup.php tests/Unit/GisCoordinateTest.php
          tests/Support/GisDatabaseTestCase.php database/migrations/2026_09_29_000001_add_gis_project_and_archive.php
      - run: php artisan test --compact --filter='Gis[A-Za-z]+Test|AssociationManagementTest|AuditLogTest'
